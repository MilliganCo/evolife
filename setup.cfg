[metadata]
name = evolife
version = 1.0.0
description = Эволюционная симуляция 'Игра Жизнь' с мутациями в ASCII
long_description = file: README.md
long_description_content_type = text/markdown
author = Evolife Team
author_email = evolife@example.com
license = MIT
license_file = LICENSE
url = https://github.com/evolife/evolife
project_urls =
    Bug Reports = https://github.com/evolife/evolife/issues
    Source = https://github.com/evolife/evolife
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Life
    Topic :: Games/Entertainment :: Simulation

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.20.0
    toml>=0.10.2
    pyyaml>=6.0

[options.packages.find]
where = .
include = evolife*

[options.entry_points]
console_scripts =
    evolife = evolife.main:main

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .pytest_cache,
    build,
    dist,
    *.egg-info

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
